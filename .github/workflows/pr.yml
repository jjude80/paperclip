name: PR
run-name: >-
  ${{ contains(github.event.pull_request.labels.*.name, 'profile-ci') && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') && format('CI profile · PR #{0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event.action != 'labeled' || github.event.label.name == 'profile-ci' || github.event.label.name == 'full-ci'
    if: github.event.action != 'labeled' || github.event.label.name == 'profile-ci' || github.event.label.name == 'full-ci'
    # judges this PR cannot be written by anyone who can push this fork. The
    # fork's own master has no review requirement; its active ruleset only
    # blocks deletion and non-fast-forward pushes (see .github/CODEOWNERS).
    # Pin it to an immutable commit instead of the moving @master ref: upstream's
    # newer revisions run `node scripts/...` checks against files this fork does
    # not have (NEXA-716). Bump the SHA deliberately when adopting upstream CI.
    uses: paperclipai/paperclip/.github/workflows/pr-trusted.yml@9b7d5b35ebe8ac1a7c6c98c7bd3cb57e3b698a00
